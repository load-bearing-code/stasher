services:
  api:
    build:
      context: services/api
      target: development
    ports:
      - "${PORT:-8080}:8080"
    environment:
      ADDR: ":8080"
      DB_PATH: "/data/stasher.db"
    volumes:
      - ./services/api:/app
      - api-gopath:/go/pkg/mod
      - api-db:/data

volumes:
  api-gopath:
  api-db:
