[package]
name = "stasher-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
stasher-protocol = { path = "../stasher-protocol" }
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["fs", "rt", "net", "time"] }
nfs3_client = { version = "0.9", features = ["tokio"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
tempfile = "3"
wiremock = "0.6"
