schema:
  - schema/*.graphql

exec:
  filename: internal/gql/generated.go
  package: gql

model:
  filename: internal/gql/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: internal/gql
  package: gql
  filename_template: "{name}.resolvers.go"

autobind:
  - "github.com/load-bearing-code/stasher/api/internal/gql/model"

models:
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.ID
  Time:
    model:
      - github.com/99designs/gqlgen/graphql.Time
  Platform:
    model:
      - github.com/load-bearing-code/stasher/api/internal/platforms.Platform
  PlatformConnection:
    model:
      - github.com/load-bearing-code/stasher/api/internal/gql.PlatformConnection
  PlatformEdge:
    model:
      - github.com/load-bearing-code/stasher/api/internal/gql.PlatformEdge
  PageInfo:
    model:
      - github.com/load-bearing-code/stasher/api/internal/page.PageInfo
  Studio:
    model:
      - github.com/load-bearing-code/stasher/api/internal/studios.Studio
  StudioConnection:
    model:
      - github.com/load-bearing-code/stasher/api/internal/gql.StudioConnection
  StudioEdge:
    model:
      - github.com/load-bearing-code/stasher/api/internal/gql.StudioEdge
  Performer:
    model:
      - github.com/load-bearing-code/stasher/api/internal/performers.Performer
  PerformerConnection:
    model:
      - github.com/load-bearing-code/stasher/api/internal/gql.PerformerConnection
  PerformerEdge:
    model:
      - github.com/load-bearing-code/stasher/api/internal/gql.PerformerEdge
  PlatformAccount:
    model:
      - github.com/load-bearing-code/stasher/api/internal/platformaccounts.PlatformAccount
  PlatformAccountConnection:
    model:
      - github.com/load-bearing-code/stasher/api/internal/gql.PlatformAccountConnection
  PlatformAccountEdge:
    model:
      - github.com/load-bearing-code/stasher/api/internal/gql.PlatformAccountEdge
