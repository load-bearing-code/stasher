type Platform {
  id: ID!
  name: String!
}

type PlatformEdge {
  node: Platform!
  cursor: String!
}

type PlatformConnection {
  edges: [PlatformEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

extend type Query {
  platforms(first: Int, after: String): PlatformConnection!
  platform(id: ID, name: String): Platform
}

input CreatePlatformInput {
  id: ID!
  name: String!
}

input UpdatePlatformInput {
  id: ID!
  name: String!
}

input DeletePlatformInput {
  id: ID!
}

type Mutation {
  createPlatform(input: CreatePlatformInput!): Platform!
  updatePlatform(input: UpdatePlatformInput!): Platform!
  deletePlatform(input: DeletePlatformInput!): Boolean!
}
