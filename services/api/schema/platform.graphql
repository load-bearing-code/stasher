type Platform {
  id: ID!
  name: String!
}

type PlatformEdge {
  node: Platform!
  cursor: String!
}

type PlatformConnection {
  edges: [PlatformEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

extend type Query {
  platforms(first: Int, after: String): PlatformConnection!
}

input CreatePlatformInput {
  id: ID!
  name: String!
}

type Mutation {
  createPlatform(input: CreatePlatformInput!): Platform!
}
